<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tylers Spiele Welt</title>
	<style>
		:root {
			--bg-1: #08131f;
			--bg-2: #132a3f;
			--panel: #0f1e2dcc;
			--line: #2f4861;
			--text: #e9f2fb;
			--muted: #9cb1c6;
			--accent: #58d7ff;
			--good: #37d488;
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
			color: var(--text);
			background:
				radial-gradient(900px 460px at 8% -8%, #2d8ec055, transparent 62%),
				radial-gradient(800px 520px at 95% 108%, #3aa57e44, transparent 62%),
				linear-gradient(140deg, var(--bg-1), var(--bg-2));
			padding: 24px;
		}

		.wrap { max-width: 1160px; margin: 0 auto; }
		.head {
			display: flex;
			justify-content: space-between;
			align-items: end;
			gap: 12px;
			margin-bottom: 16px;
		}
		.title { margin: 0; font-size: clamp(28px, 4vw, 44px); letter-spacing: .03em; }
		.sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

		.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
		.pill {
			border: 1px solid var(--line);
			background: #0f2437;
			color: var(--text);
			padding: 8px 12px;
			border-radius: 999px;
			font-size: 12px;
			letter-spacing: .08em;
			text-transform: uppercase;
			cursor: pointer;
		}
		.pill.active { background: var(--accent); color: #04263a; border-color: #8de8ff; font-weight: 700; }

		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
			gap: 14px;
		}
		.card {
			border: 1px solid var(--line);
			border-radius: 14px;
			background: var(--panel);
			backdrop-filter: blur(6px);
			overflow: hidden;
			display: flex;
			flex-direction: column;
			min-height: 280px;
			box-shadow: 0 16px 30px #00000040;
		}
		.cover {
			height: 140px;
			border-bottom: 1px solid var(--line);
			cursor: pointer;
			position: relative;
			background-size: cover;
			background-position: center;
		}
		.cover::after {
			content: "Preview";
			position: absolute;
			right: 10px;
			top: 10px;
			font-size: 10px;
			letter-spacing: .1em;
			text-transform: uppercase;
			background: #09131ecc;
			border: 1px solid #33526f;
			padding: 4px 7px;
			border-radius: 999px;
			color: #b8d9f3;
		}
		.cover-racer {
			background-image:
				radial-gradient(220px 120px at 78% 24%, #ff3d4d66, transparent 62%),
				linear-gradient(130deg, #1f242f 0%, #111a25 45%, #22384f 100%),
				repeating-linear-gradient(95deg, transparent 0 15px, #ffffff0c 15px 16px);
		}
		.cover-bush {
			background-image:
				radial-gradient(230px 120px at 28% 30%, #f8c96d88, transparent 62%),
				radial-gradient(210px 130px at 80% 74%, #62c4ff66, transparent 60%),
				linear-gradient(130deg, #26313c 0%, #334d61 44%, #16334a 100%),
				repeating-linear-gradient(96deg, transparent 0 16px, #ffffff12 16px 17px);
		}
		.cover-autobahn {
			background-image:
				radial-gradient(220px 120px at 18% 22%, #62d7ff66, transparent 58%),
				radial-gradient(180px 130px at 84% 78%, #37d48855, transparent 60%),
				linear-gradient(130deg, #0b121a 0%, #101e2a 50%, #1d3348 100%),
				repeating-linear-gradient(90deg, transparent 0 18px, #ffffff10 18px 19px);
		}
		.cover-casino {
			background-image:
				radial-gradient(180px 100px at 20% 20%, #ffd34f66, transparent 65%),
				linear-gradient(130deg, #2a1833 0%, #1a1327 45%, #2d223f 100%),
				repeating-linear-gradient(90deg, transparent 0 13px, #ffffff12 13px 14px);
		}
		.cover-geo {
			background-image:
				radial-gradient(200px 100px at 25% 80%, #62a0ff66, transparent 66%),
				linear-gradient(120deg, #13263f 0%, #102232 50%, #1b3058 100%),
				repeating-linear-gradient(90deg, transparent 0 14px, #ffffff0f 14px 15px);
		}
		.body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
		.tag {
			align-self: flex-start;
			background: #14334d;
			color: #a9d7ff;
			border: 1px solid #3b6385;
			border-radius: 999px;
			font-size: 10px;
			padding: 4px 8px;
			letter-spacing: .08em;
			text-transform: uppercase;
		}
		.name { font-size: 21px; margin: 0; }
		.desc { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
		.actions { margin-top: auto; display: flex; gap: 8px; }
		.btn {
			border: 1px solid var(--line);
			background: #15344d;
			color: #e8f3ff;
			padding: 10px 12px;
			border-radius: 10px;
			font-size: 12px;
			letter-spacing: .08em;
			text-transform: uppercase;
			font-weight: 700;
			text-decoration: none;
			text-align: center;
			flex: 1;
		}
		.btn.play { background: #1f6d4f; border-color: #3ad18b; }

		.modal {
			position: fixed;
			inset: 0;
			display: none;
			place-items: center;
			background: #03070cb0;
			padding: 20px;
			z-index: 30;
		}
		.modal.open { display: grid; }
		.modal-card {
			width: min(980px, 96vw);
			height: min(680px, 90vh);
			border: 1px solid var(--line);
			background: #091524;
			border-radius: 14px;
			overflow: hidden;
			box-shadow: 0 24px 50px #00000070;
			display: grid;
			grid-template-rows: auto 1fr;
		}
		.modal-top {
			padding: 10px 12px;
			border-bottom: 1px solid var(--line);
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 8px;
			background: #0e2133;
		}
		.modal-title { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #b6cce2; }
		.modal-close {
			border: 1px solid #3f5a77;
			background: #1a3148;
			color: #e2eef9;
			border-radius: 8px;
			padding: 6px 9px;
			cursor: pointer;
			font-size: 12px;
		}
		iframe { width: 100%; height: 100%; border: 0; background: #040a12; }

		@media (max-width: 720px) {
			body { padding: 14px; }
			.head { align-items: start; flex-direction: column; }
		}
	</style>
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2540143321826138" crossorigin="anonymous"></script>
</head>
<body>
	<div class="wrap">
		<header class="head">
			<div>
				<h1 class="title">Tylers Spiele Welt</h1>
				<p class="sub">Wahle ein Game, starte direkt im Browser und teste uber Preview.</p>
			</div>
		</header>

		<div class="filters" id="filters">
			<button class="pill active" data-filter="all">All</button>
			<button class="pill" data-filter="racing">Racing</button>
			<button class="pill" data-filter="gambling">Gambling</button>
			<button class="pill" data-filter="geo">Geo</button>
		</div>

		<section class="grid" id="grid"></section>
	</div>

	<div class="modal" id="previewModal" aria-hidden="true">
		<div class="modal-card">
			<div class="modal-top">
				<div class="modal-title" id="previewTitle">Preview</div>
				<button class="modal-close" id="previewClose">Schliessen</button>
			</div>
			<iframe id="previewFrame" title="Game Preview"></iframe>
		</div>
	</div>

	<script>
		const GAMES = [
			{
				id: 'bush-pilot',
				title: 'Bush Pilot - Island Air',
				description: 'Freies Fliegen mit Missionen, KI-Luftverkehr und echten Airports.',
				file: 'bush-pilot/index.html',
				category: 'racing',
				label: 'Flight',
				coverClass: 'cover-bush'
			},
			{
				id: 'racer',
				title: 'GT3 Web Racer',
				description: 'Rennsimulation mit KI, Schaden, Reifen und Streckeneditor.',
				file: 'gt3-web-racer.html',
				category: 'racing',
				label: 'Racing',
				coverClass: 'cover-racer'
			},
			{
				id: 'casino',
				title: 'Casino v19',
				description: 'Casino Minigames im Browser.',
				file: 'casino-v19.html',
				category: 'gambling',
				label: 'Gambling',
				coverClass: 'cover-casino'
			},
			{
				id: 'geo',
				title: 'Geo Country Guess',
				description: 'Laender Ranking Spiel mit echten Daten.',
				file: 'geo-country-guess.html',
				category: 'geo',
				label: 'Geo',
				coverClass: 'cover-geo'
			}
		];

		const state = { filter: 'all' };
		const grid = document.getElementById('grid');
		const filters = document.getElementById('filters');
		const modal = document.getElementById('previewModal');
		const frame = document.getElementById('previewFrame');
		const previewTitle = document.getElementById('previewTitle');

		function render() {
			const list = GAMES.filter(g => state.filter === 'all' || g.category === state.filter);
			grid.innerHTML = '';
			for (const game of list) {
				const card = document.createElement('article');
				card.className = 'card';
				card.innerHTML = `
					<div class="cover ${game.coverClass}" data-preview="${game.file}" data-title="${game.title}"></div>
					<div class="body">
						<span class="tag">${game.label}</span>
						<h2 class="name">${game.title}</h2>
						<p class="desc">${game.description}</p>
						<div class="actions">
							<a class="btn play" href="${game.file}">Start</a>
							<button class="btn" data-preview="${game.file}" data-title="${game.title}">Preview</button>
						</div>
					</div>
				`;
				grid.appendChild(card);
			}
		}

		function openPreview(file, title) {
			frame.src = file;
			previewTitle.textContent = title + ' - Preview';
			modal.classList.add('open');
			modal.setAttribute('aria-hidden', 'false');
		}

		function closePreview() {
			modal.classList.remove('open');
			modal.setAttribute('aria-hidden', 'true');
			frame.src = 'about:blank';
		}

		filters.addEventListener('click', (ev) => {
			const btn = ev.target.closest('[data-filter]');
			if (!btn) return;
			state.filter = btn.dataset.filter;
			for (const p of filters.querySelectorAll('.pill')) p.classList.remove('active');
			btn.classList.add('active');
			render();
		});

		document.addEventListener('click', (ev) => {
			const trg = ev.target.closest('[data-preview]');
			if (!trg) return;
			openPreview(trg.dataset.preview, trg.dataset.title || 'Game');
		});

		document.getElementById('previewClose').addEventListener('click', closePreview);
		modal.addEventListener('click', (ev) => {
			if (ev.target === modal) closePreview();
		});
		document.addEventListener('keydown', (ev) => {
			if (ev.key === 'Escape' && modal.classList.contains('open')) closePreview();
		});

		render();
	</script>
</body>
</html>
