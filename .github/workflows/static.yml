name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cancel stale Pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import urllib.request, json, os, time
          token = os.environ['GH_TOKEN']
          repo  = os.environ['REPO']
          hdrs  = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'}
          try:
            req  = urllib.request.Request(f'https://api.github.com/repos/{repo}/pages/deployments?limit=10', headers=hdrs)
            data = json.loads(urllib.request.urlopen(req).read())
            if not isinstance(data, list): raise ValueError(f'Unexpected response: {data}')
          except Exception as e:
            print(f'Skip cancel step: {e}'); exit(0)
          cancelled = 0
          for d in data:
            if d.get('status') in ('in_progress', 'queued'):
              did = d.get('id') or d.get('deployment_id', '')
              print(f'Abbrechen: {did}')
              try:
                r = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/pages/deployments/{did}/cancel',
                  data=b'', headers=hdrs, method='POST')
                urllib.request.urlopen(r)
                cancelled += 1
              except Exception as e:
                print(f'  Fehler beim Abbrechen: {e}')
          if cancelled:
            print(f'{cancelled} Deployment(s) abgebrochen, warte 8s...')
            time.sleep(8)
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
