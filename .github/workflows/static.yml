name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete stale github-pages artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import urllib.request, json, os, time
          token = os.environ['GH_TOKEN']
          repo  = os.environ['REPO']
          hdrs  = {
            'Authorization': f'Bearer {token}',
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          }

          # Delete all existing github-pages artifacts for this repo
          try:
            url = f'https://api.github.com/repos/{repo}/actions/artifacts?name=github-pages&per_page=10'
            req  = urllib.request.Request(url, headers=hdrs)
            data = json.loads(urllib.request.urlopen(req).read())
            artifacts = data.get('artifacts', [])
            deleted = 0
            for a in artifacts:
              aid = a['id']
              try:
                r = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/artifacts/{aid}',
                  headers=hdrs, method='DELETE')
                urllib.request.urlopen(r)
                deleted += 1
                print(f'Deleted artifact {aid}')
              except Exception as e:
                print(f'Could not delete {aid}: {e}')
            if deleted:
              print(f'Deleted {deleted} artifact(s), waiting 5s...')
              time.sleep(5)
            else:
              print('No stale artifacts found.')
          except Exception as e:
            print(f'Artifact cleanup skipped: {e}')
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
